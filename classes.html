<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Pengudang, With love</title>
<meta name="description" content="Cook with the women of Pengudang, a fishing village on Bintan island, Indonesia. Cooking classes, village map and stories behind each dish.">
<link rel="icon" href="images/graphics/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="classes" data-title-key="nav.classes">
<header id="nav"></header>
<main>
  <section class="section section--pink">
    <div class="deco deco--fish deco--fish-right" aria-hidden="true"></div>
    <div class="wrap">
      <h1 class="script-title" data-i18n="classes.title">Our Cooking Classes</h1>
      <p class="subtitle" data-i18n="classes.sub"></p>
      <div class="class-grid" id="class-list"></div>
      <h2 class="script-title script-title--md" style="font-size:clamp(46px,5vw,70px)" data-i18n="classes.includes">Every class includes</h2>
      <ul class="includes">
        <li data-i18n="classes.inc1"></li><li data-i18n="classes.inc2"></li>
        <li data-i18n="classes.inc3"></li><li data-i18n="classes.inc4"></li>
      </ul>
    </div>
  </section>
  <section class="section section--pink" id="book" style="padding-top:20px">
    <div class="wrap">
      <h2 class="script-title" data-i18n="home.interested">Interested?</h2>
      <p class="subtitle" data-i18n="home.signup">Sign up for a session now!</p>
      <div data-booking></div>
    </div>
  </section>
</main>
<footer id="footer"></footer>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
