<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Pengudang, With love</title>
<meta name="description" content="Get in touch with the Ibus of Pengudang about cooking classes, private groups or how to find the village.">
<link rel="icon" href="images/graphics/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact" data-title-key="nav.contact">
<header id="nav"></header>
<main>
  <section class="section section--cream page-head">
    <img class="illus illus--tl" src="images/graphics/ibu-2.svg" alt="" aria-hidden="true">
    <img class="illus illus--tr" src="images/graphics/boat.svg" alt="" aria-hidden="true">
    <div class="wrap">
      <h1 class="script-title" data-i18n="contact.title">Get in touch</h1>
      <p class="subtitle" data-i18n="contact.sub"></p>
    </div>
  </section>
  <section class="section section--pink">
    <div class="wrap contact-layout">
      <div>
        <h2 class="sub-title" data-i18n="contact.formTitle">Send us a message</h2>
        <div id="contact-form"></div>
      </div>
      <aside class="contact-aside">
        <div id="contact-info"></div>
        <div class="book-note">
          <p data-i18n="contact.bookNote"></p>
          <a class="btn btn--solid" href="classes.html" data-i18n="contact.bookLink">Browse classes</a>
        </div>
      </aside>
    </div>
  </section>
</main>
<footer id="footer"></footer>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
