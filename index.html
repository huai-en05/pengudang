<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Pengudang, With love</title>
<meta name="description" content="Cook with the women of Pengudang, a fishing village on Bintan island, Indonesia. Cooking classes, village map and stories behind each dish.">
<link rel="icon" href="images/graphics/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
<header id="nav"></header>
<main>
  <section class="section section--pink hero">
    <h1 class="hero__title" data-i18n-html="home.title">From Pengudang,<br>With love</h1>
    <div class="deco deco--fish" aria-hidden="true"></div>
  </section>

  <section class="section section--blue welcome">
    <div class="wrap">
      <h2 class="script-title" data-i18n="home.welcome">Welcome to Pengudang!</h2>
      <p data-i18n="home.intro"></p>
    </div>
    <div class="deco deco--village" aria-hidden="true"></div>
  </section>

  <section class="section section--pink">
    <div class="wrap">
      <h2 class="script-title script-title--md" data-i18n="home.classesTitle">Cook with us!</h2>
      <p class="subtitle" data-i18n="home.classesSub"></p>
      <div class="class-grid" id="home-classes"></div>
      <p class="center"><a class="btn" href="classes.html" data-i18n="home.allClasses">See all classes</a></p>
    </div>
  </section>

  <section class="section section--pink" style="padding-top:20px">
    <div class="wrap">
      <h2 class="script-title script-title--md" data-i18n="home.ibus">Meet our Ibus!</h2>
      <div id="ibus"></div>
    </div>
  </section>

  <section class="section section--blue">
    <div class="wrap">
      <h2 class="script-title" data-i18n="home.reviews">Hear from our past visitors!</h2>
      <div id="reviews"></div>
    </div>
  </section>

  <section class="section section--pink" id="book">
    <div class="wrap">
      <h2 class="script-title" data-i18n="home.interested">Interested?</h2>
      <p class="subtitle" data-i18n="home.signup">Sign up for a session now!</p>
      <div data-booking></div>
    </div>
  </section>
</main>
<footer id="footer"></footer>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
