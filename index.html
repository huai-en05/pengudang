<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Pengudang, With love</title>
<meta name="description" content="Cook with the women of Pengudang, a fishing village on Bintan island, Indonesia. Cooking classes, village map and stories behind each dish.">
<link rel="icon" href="images/graphics/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
<header id="nav"></header>
<main>
  <section class="section section--pink hero">
    <h1 class="hero__title" data-i18n-html="home.title">From Pengudang,<br>With love</h1>
    <img class="band" src="images/graphics/fish-band.png" alt="" aria-hidden="true">
  </section>

  <section class="section section--blue welcome">
    <div class="wrap">
      <h2 class="script-title" data-i18n="home.welcome">Welcome to Pengudang!</h2>
      <p data-i18n="home.intro"></p>
    </div>
    <img class="band" src="images/graphics/village-band.png" alt="" aria-hidden="true">
  </section>

  <section class="section section--pink">
    <img class="illus illus--tl" src="images/graphics/boat.svg" alt="" aria-hidden="true">
    <img class="illus illus--tr" src="images/graphics/food.svg" alt="" aria-hidden="true">
    <div class="wrap">
      <h2 class="script-title script-title--md" data-i18n="home.classesTitle">Cook with us!</h2>
      <p class="subtitle" data-i18n="home.classesSub"></p>
      <div class="class-grid" id="home-classes"></div>
      <p class="center"><a class="btn" href="classes.html" data-i18n="home.allClasses">See all classes</a></p>
    </div>
  </section>

  <section class="section section--cream">
    <img class="illus illus--br" src="images/graphics/house.svg" alt="" aria-hidden="true">
    <div class="wrap">
      <h2 class="script-title script-title--md" data-i18n="home.ibus">Meet our Ibus!</h2>
      <div id="ibus"></div>
    </div>
  </section>

  <section class="section section--navy">
    <img class="illus illus--tr" src="images/graphics/fishes.svg" alt="" aria-hidden="true">
    <div class="wrap">
      <h2 class="script-title" data-i18n="home.reviews">Hear from our past visitors!</h2>
      <div id="reviews"></div>
    </div>
  </section>

  <section class="section section--rose cta">
    <img class="illus illus--bl" src="images/graphics/food.svg" alt="" aria-hidden="true">
    <img class="illus illus--tr" src="images/graphics/ibu-1.svg" alt="" aria-hidden="true">
    <div class="wrap">
      <h2 class="script-title script-title--md" data-i18n="home.ctaTitle">Ready to cook with us?</h2>
      <p class="subtitle" data-i18n="home.ctaText"></p>
      <p class="center"><a class="btn btn--solid btn--lg" href="classes.html" data-i18n="home.ctaBtn">Browse classes</a></p>
      <p class="center cta__q"><span data-i18n="home.ctaQ">Questions first?</span> <a href="contact.html" data-i18n="home.ctaContact">Contact us</a></p>
    </div>
  </section>
</main>
<footer id="footer"></footer>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
