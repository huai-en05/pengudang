<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Pengudang, With love</title>
<meta name="description" content="Cook with the women of Pengudang, a fishing village on Bintan island, Indonesia. Cooking classes, village map and stories behind each dish.">
<link rel="icon" href="images/graphics/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="passport" data-title-key="nav.passport">
<header id="nav"></header>
<main>
  <section class="section section--cream passport-page">
    <img class="illus illus--tl" src="images/graphics/house.svg" alt="" aria-hidden="true">
    <img class="illus illus--tr" src="images/graphics/boat.svg" alt="" aria-hidden="true">
    <div class="wrap">
      <h1 class="script-title" data-i18n="passport.title">My Pengudang Passport</h1>
      <ol class="steps">
        <li><a href="map.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span data-i18n="passport.step1">Visit a place on the map</span></a></li>
        <li><span class="step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i18n="passport.step2">Snap a photo there</span></span></li>
        <li><span class="step"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5.5"/><path d="M9.5 12l1.8 1.8 3.2-3.6"/></svg><span data-i18n="passport.step3">Collect your stamp</span></span></li>
        <li><a href="classes.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M2 11h20M9 6c0-1.5 1-1.5 1-3M13 6c0-1.5 1-1.5 1-3"/></svg><span data-i18n="passport.step4">Cook with an Ibu</span></a></li>
      </ol>
      <div class="passport" id="passport"></div>
      <div class="passport-actions">
        <button class="icon-btn" type="button" id="pp-more" hidden data-i18n-aria="passport.addPhoto">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>
        <button class="btn btn--solid btn--icon" type="button" id="pp-download">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>
          <span data-i18n="passport.downloadShort">Download</span>
        </button>
        <button class="icon-btn" type="button" id="pp-reset" data-i18n-aria="passport.reset">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
        </button>
      </div>
    </div>
  </section>
</main>
<footer id="footer"></footer>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
