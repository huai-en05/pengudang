<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Pengudang, With love</title>
<meta name="description" content="Cook with the women of Pengudang, a fishing village on Bintan island, Indonesia. Cooking classes, village map and stories behind each dish.">
<link rel="icon" href="images/graphics/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="passport" data-title-key="nav.passport">
<header id="nav"></header>
<main>
  <section class="section section--pink passport-page" style="padding-top:30px">
    <div class="wrap">
      <h1 class="script-title" data-i18n="passport.title">My Pengudang Passport</h1>
      <div class="passport" id="passport"></div>
      <div class="passport-actions">
        <button class="linklike" type="button" id="pp-more" hidden data-i18n="passport.addPhoto">Add a photo</button>
        <a href="#" id="pp-download" data-i18n="passport.download">Download my passport</a>
        <button class="linklike" type="button" id="pp-reset" style="font-size:14px;opacity:.7" data-i18n="passport.reset">Start over</button>
      </div>
      <p class="passport-how" data-i18n-html="passport.how"></p>
    </div>
  </section>
</main>
<footer id="footer"></footer>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
